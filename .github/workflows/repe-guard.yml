name: repe-guard

# The guard itself needs Apple Silicon (mlx-rs is Metal-only), so the full
# benchmark suite cannot run here. What CAN run is the part that is pure
# arithmetic and has no MLX dependency: the Ledoit-Wolf whitening, the
# cross-turn trajectory, and the conformal thresholding. Those are exactly
# the parts where a silent numerical regression would be invisible until a
# calibration run hours later.
#
# The full end-to-end verification lives in `evals/verify_all.sh` and is run
# locally on the Apple Silicon machine before a release.
on:
  push:
    branches: [main]
    paths:
      - "repe-mods/**"
      - "repe-compose.py"
      - "upgrade_generic_viz.sh"
      - "evals/**"
      - "deploy/**"
      - ".github/workflows/repe-guard.yml"
  pull_request:
    paths:
      - "repe-mods/**"
      - "repe-compose.py"
      - "upgrade_generic_viz.sh"
      - "evals/**"
      - "deploy/**"
      - ".github/workflows/repe-guard.yml"

jobs:
  pure-math:
    name: pure arithmetic + generator sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The generator must be assembled from the module workspace. If the two
      # drift apart, the next local rebuild silently rewrites the project
      # with stale sources — this is the check that stops that.
      - name: generator is in sync with repe-mods/
        run: python3 repe-compose.py --check

      # The trajectory module is std-only, so it compiles and tests on its own.
      - name: trajectory tests
        run: |
          rustc --edition 2021 --test repe-mods/src/trajectory.rs -o /tmp/trajectory_test
          /tmp/trajectory_test

      # The whitening module is std-only as well.
      - name: whitening module type-checks
        run: rustc --edition 2021 --crate-type lib repe-mods/src/whiten.rs -o /tmp/libwhiten.rlib

      # The access-control module is pure arithmetic too — the bearer
      # comparison, the sliding rate-limit window and the X-Forwarded-For
      # rule. It needs `sha2` for the constant-time digest comparison, so it
      # is built as a tiny standalone crate rather than with rustc alone.
      - name: access control module tests
        run: |
          mkdir -p /tmp/access_test/src
          cp repe-mods/src/access.rs /tmp/access_test/src/lib.rs
          cat > /tmp/access_test/Cargo.toml <<'EOF'
          [package]
          name = "access_test"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          sha2 = "0.10"
          EOF
          cd /tmp/access_test && cargo test --quiet

      # The session module is the same story: the HMAC signing, the device
      # binding and the replay refusals are all pure logic, and a silent
      # regression there would be invisible until it was deployed.
      - name: session module tests
        run: |
          mkdir -p /tmp/session_test/src
          cp repe-mods/src/session.rs /tmp/session_test/src/lib.rs
          cat > /tmp/session_test/Cargo.toml <<'EOF'
          [package]
          name = "session_test"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          ring = "0.17"
          EOF
          cd /tmp/session_test && cargo test --quiet

      # The public edge config must actually LOAD, and it must load only
      # on a Caddy that has the rate_limit module.  A Caddyfile that
      # refuses to start is a deploy that cannot happen, so this builds
      # that binary and runs the edge check against the SHIPPED
      # deploy/Caddyfile: it must validate, a stock Caddy must refuse it,
      # the limit must shed load before the backend sees it, and the
      # configuration as the box will really run it — a bare hostname,
      # :443, /opt/zcode/site — must validate too, with the zones and
      # their limits in the adapted config.
      - name: the Caddy edge config loads and rate limits by IP
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          mkdir -p /tmp/caddy-rl
          "$(go env GOPATH)/bin/xcaddy" build --with github.com/mholt/caddy-ratelimit --output /tmp/caddy-rl/caddy
          # A stock Caddy, to prove the shipped config genuinely needs the
          # module rather than quietly working without it.
          curl -fsSL -o /tmp/caddy-stock.tar.gz \
            "https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz"
          tar -xzf /tmp/caddy-stock.tar.gz -C /tmp caddy
          ZCODE_CADDY_BIN=/tmp/caddy-rl/caddy ZCODE_CADDY_STOCK=/tmp/caddy \
            python3 evals/caddy_edge.py

      # The Python extractor's LSE pooling must agree with the Rust one to
      # within float32 round-off. The reference implementation recomputes the
      # statistic independently and compares.
      - name: Python extractor parses
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('extract_repe_vectors.py').read_text()); print('extract_repe_vectors.py parses')"

      - name: evaluation scripts parse
        run: |
          python3 -c "import ast, pathlib; [ast.parse(pathlib.Path(p).read_text()) for p in ['evals/canonical_40.py','evals/real_upstream_20.py','evals/access_control.py','evals/session_guard.py','evals/caddy_edge.py','evals/site_claims.py']]; print('eval scripts parse')"

      # The public site states numbers ("17/18 findings blocked").  Those
      # numbers have to be the ones its own shipped dataset supports, or
      # the page is making a claim nothing backs.
      - name: the site's headline numbers match the shipped data
        run: python3 evals/site_claims.py
